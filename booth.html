<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Booooth · Welcome</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gloria+Hallelujah&family=Montserrat:wght@400;500&display=swap" rel="stylesheet">
<!-- Self-contained. If global.css already has the page bg, .flash and wobble-a, delete the duplicates. -->
<style>
:root{--bg:#f6ecda;--ink:#2b1d17;--paper:#fff6e6;--shutter:#e0663a;--spark:#f2a93b;--hatch:#dcb07a;
  --hand:'Gloria Hallelujah',cursive;--sans:'Montserrat',system-ui,sans-serif}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:radial-gradient(circle at 50% 38%,#fbf3e3 0,#f1e0c3 100%);color:var(--ink);overflow:hidden}
.leaves{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.entrance-page{position:relative;z-index:1}
.entrance-page{height:100%;display:grid;place-items:center;padding:12px}
.booth{height:min(92vh,780px);max-width:94vw;width:auto;aspect-ratio:400/600;overflow:visible}

.booth .ink{fill:none;stroke:var(--ink);stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round}
.booth .paper{fill:var(--paper)}
.gl,.fl{stroke:var(--ink);stroke-width:2.4;stroke-linejoin:round}
.t-hand{font-family:var(--hand);fill:var(--ink)}
.t-sans{font-family:var(--sans);font-weight:500;fill:var(--ink)}

/* same slow wobble as the login camera */
@keyframes wobble-a{0%,100%{transform:rotate(-.5deg)}50%{transform:rotate(.5deg)}}
.wobble-a{animation:wobble-a 5s ease-in-out infinite;transform-origin:50% 100%}

/* sign sparks flicker */
@keyframes flick{0%,100%{opacity:1}45%{opacity:1}50%{opacity:.15}60%{opacity:1}}
.sparks{stroke:var(--spark);animation:flick 2.6s steps(1) infinite}
.sparks.b{animation-delay:1.1s}

/* photo strip peeks out of the slot */
@keyframes peek{0%,55%,100%{transform:translateY(-62px)}70%,88%{transform:translateY(0)}}
.strip{animation:peek 6s ease-in-out infinite}

/* curtain + reveal */
.curtain *{vector-effect:non-scaling-stroke}
.cl,.cr{transform-box:fill-box;transition:transform .95s cubic-bezier(.65,.02,.3,1)}
.cl{transform-origin:left center}.cr{transform-origin:right center}
.reveal,.feet{transition:opacity .4s}
.reveal{opacity:0}
.open .cl,.open .cr{transform:scaleX(.13)}
.open .reveal{opacity:1;transition-delay:.45s}
.open .feet{opacity:0;transition-delay:.2s}
.open .sparks,.open .strip,.open .shoe-b{animation:none}

/* the enter button */
.btn{cursor:pointer;outline:none}
.booth .knob{fill:var(--shutter);transition:transform .12s}
.btn:hover .knob{transform:translateY(-1px)}
.btn:active .knob,.pressed .knob{transform:translateY(3px)}
@keyframes ring{0%{transform:scale(1);opacity:.9}100%{transform:scale(1.55);opacity:0}}
.ring{fill:none;stroke:var(--spark);stroke-width:2.5;transform-box:fill-box;transform-origin:center;animation:ring 1.9s ease-out infinite}
.btn:focus-visible .focus{opacity:1}
.focus{opacity:0;fill:none;stroke:var(--ink);stroke-width:2;stroke-dasharray:4 5}
.pressed .ring{animation:none;opacity:0}

.leaf{position:absolute;top:-60px;animation:fall linear infinite}
.leaf .fl{display:block;stroke-width:1.8;animation:sway ease-in-out infinite alternate}
@keyframes fall{to{transform:translateY(115vh)}}
@keyframes sway{from{transform:translateX(-26px) rotate(-35deg)}to{transform:translateX(26px) rotate(55deg)}}
.flash{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:10}
.flash.go{animation:flash .6s ease-out forwards}
@keyframes flash{0%{opacity:0}15%{opacity:1}100%{opacity:0}}

@media (prefers-reduced-motion:reduce){
  .wobble-a,.sparks,.shoe-b,.strip,.ring{animation:none}
  .leaves{display:none}
  .cl,.cr{transition-duration:.01s}
}
</style>
</head>

<body>
<div class="leaves" id="leaves" aria-hidden="true"></div>
<main class="entrance-page">
<svg class="booth" id="booth" viewBox="0 0 400 600" role="group" aria-label="Booooth">
  <defs>
    <pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="7" height="7" fill="#f6e2bd"/><line x1="0" y1="0" x2="0" y2="7" stroke="#dcb07a" stroke-width="2.2"/>
    </pattern>
    <pattern id="hatchRust" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="7" height="7" fill="#cf6a3c"/><line x1="0" y1="0" x2="0" y2="7" stroke="#a8502a" stroke-width="2.2"/>
    </pattern>
    <symbol id="leaf" viewBox="0 0 20 34" overflow="visible"><path d="M10 1 C21 9 20 24 10 32 C0 24 -1 9 10 1Z"/><path d="M10 7 V34" fill="none"/></symbol>
    <clipPath id="slotclip"><rect x="258" y="222" width="64" height="130"/></clipPath>
  </defs>

  <g class="wobble-a">
    <!-- floor + shadow -->
    <path class="ink" d="M14 566 L386 568"/>
    <path d="M60 570 L372 570 L372 584 L60 584 Z" fill="url(#hatch)" opacity=".8"/>

    <!-- pumpkin + leaf pile -->
    <path class="ink" style="fill:#e8812f" d="M352 548 C352 530 392 530 392 548 C392 566 352 566 352 548 Z"/>
    <path class="ink" d="M366 534 C358 546 360 558 366 564 M378 534 C386 546 384 558 378 564 M372 532 V564" stroke-width="2"/>
    <path class="ink" style="fill:#6f8a3a" d="M372 532 C372 526 374 523 378 521 C377 526 376 529 374 532 Z"/>
    <use class="gl" href="#leaf" x="14" y="538" width="16" height="28" style="fill:#c8643a" transform="rotate(-72 22 552)"/>
    <use class="gl" href="#leaf" x="34" y="544" width="15" height="26" style="fill:#f2a93b" transform="rotate(38 42 557)"/>
    <use class="gl" href="#leaf" x="46" y="540" width="14" height="25" style="fill:#b3402a" transform="rotate(-18 53 552)"/>
    <use class="gl" href="#leaf" x="340" y="548" width="14" height="24" style="fill:#8a5a2b" transform="rotate(78 347 560)"/>

    <!-- body -->
    <path class="ink paper" d="M62 100 L338 98 L341 566 L58 566 Z" style="fill:#e9b872"/>

    <!-- opening -->
    <path class="ink" d="M80 566 V120 H236 V566"/>
    <rect class="paper" x="82" y="122" width="152" height="444" stroke="none" style="fill:#f3dfbc"/>

    <!-- inside the booth (shown when open) -->
    <g class="reveal">
      <rect x="82" y="122" width="152" height="444" fill="#ffd79a" stroke="none"/>
      <circle class="ink paper" cx="158" cy="250" r="42"/>
      <circle class="ink" cx="158" cy="250" r="28"/>
      <path class="ink" d="M140 238 Q146 228 158 226" stroke-width="2.4"/>
      <ellipse class="ink paper" cx="158" cy="472" rx="36" ry="8" style="fill:#c8643a"/>
      <path class="ink" d="M158 480 V554 M138 560 Q158 570 178 560"/>
    </g>

    <!-- curtain rod + curtain -->
    <path class="ink" d="M76 124 L240 124"/>
    <g class="curtain">
      <g class="cl">
        <path class="ink" d="M82 126 H158 V514 H82 Z" style="fill:url(#hatchRust)"/>
        <path class="ink" d="M101 128 V512 M120 128 V512 M139 128 V512" stroke-width="2"/>
      </g>
      <g class="cr">
        <path class="ink" d="M158 126 H234 V514 H158 Z" style="fill:url(#hatchRust)"/>
        <path class="ink" d="M177 128 V512 M196 128 V512 M215 128 V512" stroke-width="2"/>
      </g>
    </g>

    <!-- control panel -->
    <rect class="ink paper" x="254" y="128" width="68" height="344" rx="6"/>
    <rect class="ink" x="262" y="138" width="52" height="62" rx="4" style="fill:url(#hatch)"/>
    <text class="t-hand" x="288" y="164" font-size="12" text-anchor="middle" style="paint-order:stroke;stroke:#fff;stroke-width:4px">4 pics</text>
    <text class="t-hand" x="288" y="182" font-size="12" text-anchor="middle" style="paint-order:stroke;stroke:#fff;stroke-width:4px">1 strip</text>
    <g clip-path="url(#slotclip)">
      <g class="strip">
        <rect class="ink paper" x="277" y="216" width="22" height="64" rx="2"/>
        <rect class="ink" x="281" y="222" width="14" height="10" stroke-width="2"/>
        <rect class="ink" x="281" y="236" width="14" height="10" stroke-width="2"/>
        <rect class="ink" x="281" y="250" width="14" height="10" stroke-width="2"/>
        <rect class="ink" x="281" y="264" width="14" height="10" stroke-width="2"/>
      </g>
    </g>
    <rect class="ink paper" x="264" y="212" width="48" height="10" rx="4"/>
    <rect class="ink" x="276" y="300" width="24" height="30" rx="3"/>
    <circle cx="288" cy="316" r="3" fill="var(--ink)"/>

    <!-- enter button -->
    <g class="btn" id="enter" role="button" tabindex="0" aria-label="Enter the photobooth">
      <circle class="ring" cx="288" cy="394" r="25"/>
      <circle class="focus" cx="288" cy="394" r="33"/>
      <circle class="ink knob" cx="288" cy="394" r="25"/>
      <circle cx="288" cy="394" r="38" fill="transparent"/>
    </g>
    <text class="t-hand" x="288" y="452" font-size="14" text-anchor="middle">enter</text>

    <!-- roof slab + sign -->
    <path class="ink paper" d="M50 86 L350 84 L352 102 L48 104 Z" style="fill:#b9552f"/>
    <path class="ink paper" d="M104 36 L296 34 L298 84 L102 86 Z" style="fill:#fff0cc"/>
    <text class="t-sans" x="203" y="70" font-size="18" letter-spacing="6" text-anchor="middle">BOOOOTH</text>
    <path class="ink sparks" d="M92 46 L76 38 M90 60 L70 60 M92 74 L76 82 M308 46 L324 38 M310 60 L330 60 M308 74 L324 82" stroke-width="3"/>
    <path class="ink sparks b" d="M130 26 L124 12 M200 24 V8 M272 26 L278 12" stroke-width="3"/>
  </g>
</svg>
</main>

    <!-- Starts white and fades out so the login flash flows into this page -->
    <div class="flash flash-out" aria-hidden="true"></div>
    <script src="javascript/booth.js"></script>
</body>
</html>
