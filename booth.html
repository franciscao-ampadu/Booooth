<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Boothmap · Booth</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Gloria+Hallelujah&family=Montserrat:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles/global.css">
    <link rel="stylesheet" href="styles/booth.css">
</head>
<body>
    <main class="booth">
        <header class="booth-header">
            <a class="back-link" href="login.html">← home</a>
        </header>

        <!-- STEP 1: camera + countdown -->
        <section id="stage" class="stage">
            <div class="camera-frame wobble-a">
                <video id="video" autoplay playsinline muted></video>
                <div id="countdown" class="countdown" aria-live="assertive"></div>
                <p id="cameraMsg" class="camera-msg">Allow camera access to start…</p>
            </div>

            <ol class="thumbs" aria-label="Your 4 shots">
                <li></li><li></li><li></li><li></li>
            </ol>

            <button id="startBtn" class="btn-booth wobble-a" disabled>Start</button>
        </section>

        <!-- STEP 2: the printed strip -->
        <section id="review" class="review" hidden>
            <div class="strip-wrap"><canvas id="strip"></canvas></div>

            <div class="controls">
                <div class="chips" id="filterChips" aria-label="Filter">
                    <button data-filter="none" class="active">Colour</button>
                    <button data-filter="bw">B&amp;W</button>
                    <button data-filter="vintage">Vintage</button>
                </div>
                <div class="chips" id="frameChips" aria-label="Frame colour">
                    <button data-frame="white" class="active">White</button>
                    <button data-frame="pink">Pink</button>
                    <button data-frame="blue">Blue</button>
                    <button data-frame="ink">Black</button>
                </div>
                <div class="actions">
                    <button id="retakeBtn" class="btn-outline wobble-a">Retake</button>
                    <button id="downloadBtn" class="btn-outline wobble-a">Download</button>
                    <button id="postBtn" class="btn-booth wobble-a">Post</button>
                </div>
            </div>
        </section>
    </main>

    <div class="flash" id="shotFlash" aria-hidden="true"></div>
    <!-- Page-entrance flash: fades out when you arrive from the login -->
    <div class="flash flash-out" aria-hidden="true"></div>
    <script src="javascript/booth.js"></script>
</body>
</html>
