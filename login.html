<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Boothmap · Login</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Gloria+Hallelujah&family=Montserrat:wght@400;500&display=swap"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="styles/global.css">
    <link rel="stylesheet" href="styles/auth.css">
</head>

<body>

    <main class="login-page">

        <div class="camera" id="camera">

            <div class="camera-bump" aria-hidden="true"></div>

            <div class="camera-body wobble-a">

                <div class="camera-top">
                    <div
                        class="camera-flash-window hatch"
                        aria-hidden="true">
                    </div>

                    <h1 class="camera-title">BOOTHMAP</h1>
                </div>


                <!-- CAMERA LENS / LOGIN FORM -->
                <div class="lens-outer wobble-c">

                    <div class="lens-inner">

                        <form id="loginForm" class="login-form">

                            <div class="tagline">
                                say cheese!
                            </div>

                            <!-- EMAIL -->
                            <label>
                                email

                                <input
                                    type="email"
                                    name="email"
                                    id="email"
                                    autocomplete="email"
                                    required
                                >
                            </label>


                            <!-- PASSWORD -->
                            <label>
                                password

                                <input
                                    type="password"
                                    name="password"
                                    id="password"
                                    autocomplete="current-password"
                                    required
                                >
                            </label>


                            <!-- LOGIN ERROR -->
                            <p id="loginError"></p>

                        </form>

                    </div>

                </div>


                <!-- CAMERA SHUTTER LOGIN BUTTON -->
                <div class="shutter-wrap">

                    <button
                        type="submit"
                        form="loginForm"
                        id="shutter"
                        class="shutter"
                        aria-label="Take the photo and log in">
                    </button>

                    <span>tap to log in</span>

                </div>


                <!-- GOOGLE LOGIN -->
                <div class="google-login-wrap">

                    <span class="login-divider">
                        or
                    </span>

                    <button
                        type="button"
                        id="googleLogin"
                        class="google-login">
                        Continue with Google
                    </button>

                </div>

            </div>

        </div>


        <a class="back-link" href="index.html">
            ← back to home
        </a>

    </main>


    <!-- CAMERA FLASH -->
    <div
        class="flash"
        id="flash"
        aria-hidden="true">
    </div>


    <!-- SUPABASE LIBRARY -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- SHARED SUPABASE CONNECTION -->
    <script src="javascript/supabase.js"></script>

    <!-- LOGIN LOGIC -->
    <script src="javascript/auth.js"></script>

</body>
</html>
