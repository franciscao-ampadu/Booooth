<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Booooth · Create Account</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Gloria+Hallelujah&family=Montserrat:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles/global.css">
    <link rel="stylesheet" href="styles/auth.css">
</head>

<body>
<main class="login-page">
    <div class="camera" id="camera">

        <!-- shutter button on TOP of the camera -->
        <div class="shutter-wrap">
            <span class="shutter-label">press to sign up</span>
            <button type="submit" form="signupForm" id="shutter" class="shutter"
                    aria-label="Take the photo and create your account"></button>
        </div>

        <!-- mode dial on top -->
        <div class="mode-dial" aria-hidden="true"></div>

        <div class="camera-body wobble-a">
            <div class="camera-top">
                <div class="eyepiece" aria-hidden="true"></div>
                <h1 class="camera-title">BOOOOTH</h1>
                <div class="camera-flash-window hatch" aria-hidden="true"></div>
            </div>

            <!-- back of the camera: screen + controls -->
            <div class="camera-back">
                <div class="lcd wobble-c">
                    <form id="signupForm" class="login-form signup-form">
                        <div class="tagline">join the booth!</div>
                        <label>username
                            <input
                                type="text"
                                name="username"
                                id="username"
                                autocomplete="username"
                                required
                            >
                        </label>

                        <label>email
                            <input
                                type="email"
                                name="email"
                                id="signupEmail"
                                autocomplete="email"
                                required
                            >
                        </label>

                        <label>password
                            <input
                                type="password"
                                name="password"
                                id="signupPassword"
                                autocomplete="new-password"
                                required
                                minlength="6"
                            >
                        </label>

                        <p id="signupError"></p>
                    </form>
                </div>

                <div class="controls" aria-hidden="true">
                    <div class="dpad"><div class="dpad-center"></div></div>
                    <div class="small-buttons">
                        <span></span>
                        <span></span>
                    </div>
                    <div class="thumb-grip"></div>
                </div>
            </div>
        </div>
    </div>

    <a href="index.html" class="create-account-button">Already have an account? Log in</a>
</main>

<div class="flash" id="flash" aria-hidden="true"></div>
<!-- SUPABASE -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<!-- SHARED SUPABASE CLIENT -->
<script src="javascript/supabase.js"></script>

<!-- CREATE ACCOUNT LOGIC -->
<script src="javascript/create-account.js"></script>
</body>
</html>
